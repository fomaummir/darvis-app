<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0b0f">
<title>Дарвис — поиск сервера…</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #0a0b0f; color: #e4e4e7; font: 15px/1.5 system-ui, -apple-system, Roboto, sans-serif; display: flex; align-items: center; justify-content: center; }
  .card { max-width: 460px; width: 92%; padding: 26px 22px; border-radius: 20px; border: 1px solid rgba(251,191,36,.25); background: rgba(24,25,29,.7); text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: #fbbf24; color: #000; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; margin-bottom: 12px; }
  h1 { font-size: 19px; margin-bottom: 6px; }
  p { color: #a1a1aa; font-size: 13px; }
  .st { margin: 14px 0 4px; font-size: 13px; color: #fbbf24; min-height: 20px; }
  .urls { margin: 10px 0 0; text-align: left; font-size: 11px; color: #71717a; max-height: 130px; overflow-y: auto; }
  .urls div { padding: 3px 0; word-break: break-all; border-bottom: 1px dashed rgba(255,255,255,.06); }
  .ok { color: #4ade80; } .bad { color: #f87171; }
  .btn { display: inline-block; margin: 14px 6px 0; padding: 11px 18px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; text-decoration: none; }
  .btn-a { background: #fbbf24; color: #000; }
  .btn-g { background: #1c1d23; color: #e4e4e7; border: 1px solid rgba(255,255,255,.12); }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid #fbbf24; border-top-color: transparent; border-radius: 50%; animation: s 1s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Д</div>
  <h1>Дарвис — ДОФА МИР</h1>
  <p>Ищу живой сервер Дарвиса…</p>
  <div class="st" id="st"><span class="spin"></span>проверяю список адресов</div>
  <div class="urls" id="urls"></div>
  <div id="acts" style="display:none">
    <a class="btn btn-a" href="standalone.html">Лайт-версия (без сервера)</a>
    <button class="btn btn-g" onclick="location.reload()">Искать снова</button>
  </div>
  <p style="margin-top:12px;font-size:11px;color:#52525b">Если сервер умер — открой новый чат Дарвиса, сервер переедет,<br>а этот лоадер найдёт его сам.</p>
</div>
<script>
(async function () {
  var st = document.getElementById("st");
  var urlsBox = document.getElementById("urls");
  var acts = document.getElementById("acts");
  function log(t, cls) {
    var d = document.createElement("div");
    d.className = cls || "";
    d.textContent = t;
    urlsBox.appendChild(d);
  }
  var urls = [];
  try {
    var r = await fetch("./ADDRESS.json?_=" + Date.now(), { cache: "no-store" });
    if (r.ok) { var d = await r.json(); urls = (d.urls || []).filter(Boolean); }
  } catch (e) {}
  if (!urls.length) { st.textContent = "ADDRESS.json не найден — пробую лайт-версию"; acts.style.display = "block"; return; }
  for (var i = 0; i < urls.length; i++) {
    var u = urls[i].replace(/\/$/, "");
    st.innerHTML = '<span class="spin"></span>проверяю ' + (i + 1) + " из " + urls.length + "…";
    try {
      var c = await fetch(u + "/api/health", { signal: AbortSignal.timeout(3500), cache: "no-store" });
      if (c.ok) {
        var j = null; try { j = await c.json(); } catch (e) {}
        if (j && j.ok) {
          log("✓ " + u, "ok");
          st.textContent = "Сервер найден! Перехожу…";
          location.replace(u);
          return;
        }
      }
      log("✗ " + u, "bad");
    } catch (e) { log("✗ " + u, "bad"); }
  }
  st.textContent = "Живого сервера пока нет";
  acts.style.display = "block";
})();
</script>
</body>
</html>
